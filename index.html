<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
    <title>西螺城市尋寶</title>
    
    <link rel="manifest" href="manifest.json">
    
   
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西螺城市尋寶</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .shadow-glow-gold { box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
        .shadow-glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }

/* ==========================================
   📱 手機板專用響應式優化設定 (RWD)
   ========================================== */
@media screen and (max-width: 768px) {
    /* 1. 全域寬度防護：防止畫面左右晃動出現白邊 */
    html, body {
        width: 100%;
        overflow-x: hidden;
        font-size: 16px; /* 基礎手機舒適字級 */
    }

    /* 2. 容器調整：縮小手機版的左右內距，讓字數最大化呈現 */
    .container, .view-section, .quiz-card {
        width: 95% !important;
        max-width: 100% !important;
        padding: 15px 10px !important;
        margin: 10px auto !important;
        box-sizing: border-box;
    }

    /* 3. 輸入框與按鈕指尖優化：調大高度方便手機盲點 */
    input[type="text"], input[type="password"], button {
        min-height: 44px; /* 符合 Apple 與 Google 最小觸控安全範圍標準 */
        font-size: 16px !important; /* 防止 iOS Safari 點擊輸入框時畫面自動放大 */
        padding: 10px !important;
    }

    /* 4. 關卡大廳按鈕優化：改成直列或大格子，方便走路時單手點擊 */
    .levels-grid {
        display: grid;
        grid-template-columns: 1fr !important; /* 手機版一律單欄排列 */
        gap: 12px !important;
    }

    /* 5. 頂部抬頭顯示器 (HUD) 的排版修正 */
    #player-hud {
        flex-direction: column; /* 名字跟時間在手機上改成上下並排 */
        gap: 5px;
        padding: 10px !important;
        text-align: center;
    }

    /* 6. 音樂點歌機面板在手機上的極致優化 (改為底部通欄或縮小) */
    #music-control-panel {
        bottom: 10px !important;
        right: 10px !important;
        left: 10px !important; /* 寬度撐滿底部 */
        width: calc(100% - 20px) !important;
        flex-direction: row !important; /* 橫向排列，節省高度空間 */
        align-items: center;
        padding: 8px !important;
        border-radius: 8px;
        background-color: rgba(0, 0, 0, 0.9);
    }

    #music-search-input {
        flex: 1; /* 讓輸入框自動吃滿剩餘空間 */
        margin-bottom: 0 !important;
    }

    #music-control-panel button {
        padding: 8px 12px !important;
        white-space: nowrap; /* 防止按鈕字體斷行 */
    }
}

    </style>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between select-none">

    <header id="player-hud" class="bg-slate-900/90 backdrop-blur border-b border-slate-800 p-4 sticky top-0 z-40 hidden justify-between items-center transition-all duration-300">
        <div>
            <span class="text-xs text-slate-400 block font-medium">挑戰隊伍</span>
            <span id="display-player-name" class="font-extrabold text-amber-400 text-lg tracking-wide">---</span>
        </div>
        
        <div class="flex items-center space-x-3">
            <div id="timer-box" class="bg-slate-950 border border-slate-800 px-4 py-1.5 rounded-xl flex items-center space-x-3 transition-colors duration-300">
                <span id="timer-label" class="text-xs font-semibold text-slate-400">⏳ 剩餘時間</span>
                <span id="game-timer" class="font-mono text-lg font-bold text-white tracking-wider">180:00:00</span>
            </div>
            <div id="penalty-box" class="bg-red-950/40 border border-red-900/60 px-3 py-1.5 rounded-xl text-center">
                <span class="text-[10px] text-red-400 block font-medium">累計加罰</span>
                <span id="penalty-minutes" class="text-red-400 font-bold font-mono text-sm">+0 分</span>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-xl mx-auto w-full flex items-center justify-center">
        
        <div id="home-view" class="w-full bg-slate-900/60 border border-slate-800/80 p-6 rounded-2xl shadow-xl text-center flex flex-col space-y-6">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200 tracking-wider">西螺城市尋寶</h1>
                <p class="text-slate-400 text-xs mt-2">⏱️ 總作答時間 180 分鐘 | ⚠️ 包含答錯與提示懲罰機制</p>
            </div>
            <div class="space-y-2 text-left">
                <label class="text-sm font-semibold text-slate-300 block">請輸入隊伍或玩家名稱：</label>
                <input type="text" id="player-name-input" placeholder="例如：西螺特攻隊" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 placeholder-slate-600 font-medium">
            </div>
            <button onclick="startAdventure()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-98 cursor-pointer text-base tracking-wide">
                開啟尋寶之旅 ➔
            </button>
        </div>

        <div id="levels-view" class="w-full hidden space-y-6">
            <div class="text-left">
                <button onclick="switchView('home-view')" class="text-xs bg-slate-900 hover:bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-800 transition cursor-pointer font-medium">
                    ⬅ 回到首頁
                </button>
            </div>
		<div id="home-game-timer" class="text-amber-400 font-mono font-bold text-center text-lg my-2"></div>
            <div class="text-center">
                <h2 class="text-2xl font-bold text-white tracking-wide">🗺️ 尋寶關卡選單</h2>
                <p id="levels-subtitle" class="text-xs text-slate-400 mt-1">請點擊任一關卡前往現場尋找線索</p>
            </div>
            
            <div id="levels-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            
            <button id="floating-score-btn" onclick="openScoreBoard()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition hidden cursor-pointer tracking-wide text-center">
                🏆 查看大會最終結算成績單
            </button>
        </div>

        <div id="quiz-view" class="w-full hidden bg-slate-900/60 border border-slate-800/80 p-6 rounded-2xl shadow-xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div>
                    <span id="quiz-id" class="text-xs font-mono font-bold text-amber-500 block tracking-widest">LEVEL 01</span>
                    <h2 id="quiz-title" class="text-xl font-bold text-white tracking-wide">關卡載入中...</h2>
                </div>
                <button onclick="switchView('levels-view')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition cursor-pointer font-medium">
                    ⬅ 返回地圖
                </button>
            </div>

            <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800/60">
                <p id="quiz-description" class="text-slate-300 leading-relaxed text-sm whitespace-pre-line">題目內容敘述...</p>
            </div>

            <div id="quiz-wrong-count" class="text-xs font-bold text-red-400 bg-red-950/20 px-3 py-2 rounded-lg border border-red-900/30">
                ❌ 本關已錯：0 次
            </div>

            <div class="border-t border-slate-800 pt-4 space-y-2">
                <h3 id="hint-section-title" class="text-xs font-bold text-slate-400">索取線索提示：</h3>
                <p id="hint-penalty-notice" class="text-[11px] text-red-400 transition-all">⚠️ 注意：解鎖新提示會累積加罰 10 分鐘！</p>
                <div id="hint-buttons-container" class="grid grid-cols-3 gap-2">
                    <button id="hint-btn-1" onclick="askForHint(1)" class="w-full py-2.5 bg-slate-800 text-amber-400 border border-slate-700 rounded-xl text-xs font-semibold cursor-pointer transition">💡 提示一</button>
                    <button id="hint-btn-2" onclick="askForHint(2)" class="w-full py-2.5 bg-slate-800 text-amber-400 border border-slate-700 rounded-xl text-xs font-semibold cursor-pointer transition">💡 提示二</button>
                    <button id="hint-btn-3" onclick="askForHint(3)" class="w-full py-2.5 bg-slate-800 text-amber-400 border border-slate-700 rounded-xl text-xs font-semibold cursor-pointer transition">💡 提示三</button>
                </div>
            </div>

            <div class="space-y-3 pt-2">
                <input type="text" id="answer-input" placeholder="請輸入答案..." class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white outline-none font-medium transition focus:border-amber-500">
                <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl shadow-md transition cursor-pointer text-base tracking-wide">
                    提交答案
                </button>
                <div id="feedback-message" class="hidden text-center text-sm p-3 rounded-xl font-semibold border transition-all duration-300"></div>
            </div>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-slate-600 border-t border-slate-900 bg-slate-950/80">
        <p>© 2026 西螺城市尋寶活動小組</p>
        <button id="reset-game-btn" onclick="triggerResetProgress()" class="mt-2 text-red-500/70 hover:text-red-400 underline cursor-pointer hidden font-medium">重置遊戲進度</button>
    </footer>

    <div id="hint-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm text-center space-y-4 shadow-2xl scale-95 transition-transform duration-300">
            <div id="modal-hint-icon" class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center mx-auto text-xl font-bold">💡</div>
            <h3 id="modal-hint-title" class="text-lg font-bold text-white tracking-wide">確認提示</h3>
            <p id="modal-hint-warning" class="text-xs text-slate-400 leading-relaxed">警語內容</p>
            <div id="modal-hint-content" class="bg-slate-950 p-4 rounded-xl text-left text-sm border border-slate-800 text-amber-300 font-medium hidden whitespace-pre-line max-h-40 overflow-y-auto">提示內容文字...</div>
            <div class="flex space-x-2 pt-2">
                <button id="modal-cancel-btn" onclick="closeHint()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-semibold cursor-pointer transition">取消</button>
                <button id="modal-confirm-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 py-2.5 rounded-xl text-sm font-bold cursor-pointer transition">確認</button>
            </div>
        </div>
    </div>

    <div id="finish-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border-2 border-amber-500 p-6 rounded-2xl w-full max-w-md my-8 space-y-5 shadow-2xl shadow-glow-gold transition-all duration-300">
            <div id="finish-modal-icon" class="text-4xl text-center animate-bounce">🏆</div>
            <h3 id="finish-modal-title" class="text-2xl font-extrabold text-center text-amber-400 tracking-wider">挑戰成功！</h3>
            <p id="finish-modal-subtitle" class="text-xs text-slate-400 text-center -mt-3">成績單大會官方結算明細</p>
            
            <div id="finish-results-box" class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3 font-medium text-sm"></div>
            
            <button id="finish-modal-close-btn" onclick="closeFinishModal()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-md transition cursor-pointer text-center tracking-wide text-base">
                關閉並返回 ➔
            </button>
        </div>
    </div>

    <script src="ui-effects.js"></script>
    <script src="game-logic.js"></script>
<audio id="bg-music" src="music.mp3" loop></audio>

</body>
</html>
