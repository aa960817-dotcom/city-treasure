<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市尋寶：神祕的時空軌跡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-overlay {
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1508847154043-be12a62861c1?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* 金色閃爍與微光特效 */
        .shadow-glow-gold {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
            100% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.9); border-color: rgba(245, 158, 11, 1); }
        }
    </style>
</head>
<body class="bg-overlay text-slate-100 font-sans min-h-screen">

    <div id="player-hud" style="display: none;" class="fixed top-4 left-4 z-50 bg-slate-900/95 backdrop-blur border border-amber-500/30 px-4 py-2 rounded-xl shadow-2xl flex items-center space-x-2">
        <span class="text-amber-400 text-xs font-semibold">🤠 冒險者:</span>
        <span id="display-player-name" class="text-sm font-bold text-white tracking-wide"></span>
    </div>

    <div id="timer-container" style="display: none;" class="fixed top-4 right-16 z-50 flex flex-col items-end space-y-2">
        <div id="timer-box" class="bg-slate-900/95 backdrop-blur border border-amber-500/50 px-5 py-2 rounded-xl shadow-2xl flex items-center space-x-3">
            <span id="timer-label" class="text-amber-400 text-xs font-semibold tracking-wider">剩餘時間</span>
            <span id="game-timer" class="text-xl font-mono font-bold text-white tracking-widest">03:00:00</span>
        </div>
        <div id="penalty-box" class="bg-red-950/90 backdrop-blur border border-red-500/40 px-3 py-1 rounded-lg shadow-lg flex items-center space-x-2 text-xs font-semibold text-red-300">
            <span>⚠️ 累積加罰：</span>
            <span id="penalty-minutes" class="text-red-400 font-bold font-mono text-sm">+0</span>
            <span>分鐘</span>
        </div>
    </div>

    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleMusic()" id="music-btn" class="bg-slate-800/80 hover:bg-slate-700/80 backdrop-blur text-white p-3 rounded-full shadow-lg border border-slate-600 transition flex items-center justify-center cursor-pointer">
            <span id="music-icon" class="text-xl">🔇</span>
        </button>
    </div>

    <div id="floating-score-btn" style="display: none;" class="fixed bottom-6 right-6 z-50">
        <button onclick="openScoreBoard()" class="bg-slate-900/95 hover:bg-slate-800 border-2 border-amber-500 text-amber-400 font-bold py-3 px-5 rounded-2xl shadow-2xl transition duration-300 transform hover:scale-105 flex items-center space-x-2 shadow-glow-gold cursor-pointer">
            <span>🏆</span>
            <span class="tracking-wide text-sm">查看成績</span>
        </button>
    </div>

    <div id="home-view" style="display: flex;" class="flex flex-col items-center justify-center min-h-screen text-center px-4">
        <h1 class="text-4xl md:text-5xl font-extrabold text-amber-400 mb-4 tracking-wider drop-shadow-md">西螺城市尋寶</h1>
        <p class="text-lg text-slate-300 mb-6 max-w-md">穿梭在城市的巷弄與歷史建築間，解開隱藏在角落的七大謎題，找出最終的真相吧！</p>
        
        <div class="bg-slate-900/90 border border-slate-700/60 p-5 rounded-2xl shadow-2xl mb-8 max-w-xs w-full">
            <label for="player-name-input" class="block text-sm font-medium text-amber-400 mb-2 flex items-center justify-center gap-1">
                🔑 請輸入隊伍或玩家名稱
            </label>
            <input type="text" id="player-name-input" maxlength="6" 
                   class="w-full text-center px-4 py-2.5 bg-slate-800 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition font-semibold" 
                   placeholder="限 6 個字以內...">
        </div>

        <div class="flex flex-col items-center space-y-4">
            <button onclick="startAdventure()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-lg py-4 px-10 rounded-full shadow-xl transition duration-300 transform hover:scale-105 cursor-pointer">
                開始尋寶之旅 ➔
            </button>
            <button id="reset-game-btn" onclick="clearSavedData()" style="display: none;" class="text-xs text-red-400/60 hover:text-red-400 underline transition cursor-pointer">
                ⚠️ 清除紀錄並重置遊戲
            </button>
        </div>
    </div>

    <div id="levels-view" style="display: none;" class="max-w-4xl mx-auto px-4 py-12 mt-24">
        <h2 class="text-3xl font-bold text-center text-amber-400 mb-2 drop-shadow">選擇尋寶關卡</h2>
        <p id="levels-subtitle" class="text-center text-slate-400 mb-10">點選任一關卡前往神祕地點</p>
        
        <div id="levels-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            </div>

        <div class="text-center mt-12">
            <button onclick="switchView('home-view')" class="text-amber-400 hover:text-amber-300 font-medium cursor-pointer">
                ← 返回主頁
            </button>
        </div>
    </div>

    <div id="quiz-view" style="display: none;" class="max-w-xl mx-auto px-4 py-12 mt-24">
        <button onclick="switchView('levels-view')" class="text-slate-400 hover:text-slate-200 mb-6 flex items-center cursor-pointer">
            ← 返回關卡選單
        </button>
        
        <div class="bg-slate-900/90 backdrop-blur rounded-2xl shadow-2xl p-8 border border-slate-700/50">
            <div class="flex justify-between items-start mb-2">
                <span id="quiz-id" class="text-amber-400 font-semibold uppercase tracking-wider block"></span>
                <span id="quiz-wrong-count" class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded border border-slate-700"></span>
            </div>
            <h3 id="quiz-title" class="text-2xl font-bold text-white mb-4"></h3>
            <div id="quiz-description" class="text-slate-300 mb-8 leading-relaxed bg-slate-800/60 p-4 rounded-xl border border-slate-700/30 whitespace-pre-line"></div>
            
            <div class="space-y-4 mb-8">
                <div>
                    <label for="answer-input" class="block text-sm font-medium text-slate-300 mb-2">請輸入你的答案</label>
                    <input type="text" id="answer-input" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition" placeholder="輸入謎底...">
                </div>
                
                <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow-md transition duration-200">
                    提交答案
                </button>
            </div>

            <div id="feedback-message" style="display: none;" class="mt-6 text-center font-semibold p-3 rounded-xl mb-6"></div>

            <div class="border-t border-slate-700/50 pt-6">
                <p id="hint-section-title" class="text-sm text-slate-400 mb-1 font-medium">遇到了瓶頸嗎？索取線索提示：</p>
                <p id="hint-penalty-notice" class="text-xs text-red-400 mb-3">⚠️ 注意：未解鎖的提示一經查看會累積加罰 10 分鐘至主成績，解鎖後可永久免費重複查看。</p>
                <div id="hint-buttons-container" class="grid grid-cols-3 gap-3">
                    <button id="hint-btn-1" onclick="askForHint(1)" class="w-full font-medium py-2 px-1 rounded-xl text-xs transition cursor-pointer border">
                        💡 提示一
                    </button>
                    <button id="hint-btn-2" onclick="askForHint(2)" class="w-full font-medium py-2 px-1 rounded-xl text-xs transition cursor-pointer border">
                        💡 提示二
                    </button>
                    <button id="hint-btn-3" onclick="askForHint(3)" class="w-full font-medium py-2 px-1 rounded-xl text-xs transition cursor-pointer border">
                        💡 提示三
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="hint-modal" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/70 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <div id="modal-hint-icon" class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold mb-4 mx-auto border border-amber-500/30 text-xl">
                ⏱️
            </div>
            <h4 id="modal-hint-title" class="text-lg font-bold text-amber-400 mb-2">確認要查看提示嗎？</h4>
            <p id="modal-hint-warning" class="text-sm text-slate-400 mb-4"></p>
            <div id="modal-hint-content" style="display: none;" class="text-slate-300 mb-6 leading-relaxed bg-slate-800/50 p-3 rounded-xl text-sm whitespace-pre-line text-left"></div>
            
            <div class="flex space-x-3">
                <button id="modal-cancel-btn" onclick="closeHint()" class="bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-xl text-sm border border-slate-600 transition cursor-pointer w-1/2">
                    取消
                </button>
                <button id="modal-confirm-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-2 px-4 rounded-xl text-sm transition cursor-pointer w-1/2">
                    確定查看
                </button>
            </div>
        </div>
    </div>

    <div id="finish-modal" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-950/90 backdrop-blur-md">
        <div class="bg-slate-900 border-2 border-amber-500 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center relative max-h-[90vh] overflow-y-auto">
            
            <button onclick="closeFinishModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold p-1 cursor-pointer transition">✕</button>

            <div id="finish-modal-icon" class="w-16 h-16 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold mb-4 mx-auto border border-amber-500/30 text-3xl">
                🏆
            </div>
            <h3 id="finish-modal-title" class="text-2xl font-extrabold text-amber-400 mb-1 tracking-wide">前七關主線挑戰成功！</h3>
            <p id="finish-modal-subtitle" class="text-sm text-slate-400 mb-6">主線任務已全數擊破，計時已停止結算！</p>
            
            <div id="finish-results-box" class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 text-left space-y-3 mb-6 font-mono text-sm">
                </div>
            <button id="finish-modal-close-btn" onclick="closeFinishModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer">
                返回遊戲 ➔
            </button>
        </div>
    </div>

    <audio id="bg-music" loop src="bgm.mp3"></audio>

    <script>
        // 資料庫
        const levelsData = [
            { id: 1, title: "第一關：森活武樹園區", desc: "謎題：請觀察道具卡2，解出？\n\n請觀察道具卡3，解出#\n\n請觀察道具卡4，找出共通點！\n\n站立？#！，使用道具卡5、6找出最終謎底", answer: "頭崁－雙龍取水", hints: ["道具卡2警鈴、示警、警察、警報；道具卡3酉+告=酷、穴+告=窖、告+鳥=鵠、告+非=靠。", "道具卡4為撲克牌、車牌、門牌、招牌。", "在公園尋找警告牌實際的位置並站在此地(可參考森活武樹園區地圖)，將兩張道具卡5、6重疊，方向標北邊朝下，將基準方向對準警告牌救生圈，觀察另一箭頭指向得出答案。"] },
            { id: 2, title: "第二關：金玉成鐘樓", desc: "謎題：阿善師在這條街上尋找最高的古鐘。\n\n330°西北=基準點\n\n東南150°(24小時制)：東北60°、北0°", answer: "18:31", hints: ["先找到西螺老街上那個最高的鐘並利用道具卡8、道具卡9拼出與其時鐘相同的樣式。", "打開手機指南針APP，330°西北=基準點，對照時鐘為12點(可站在時鐘對面的西螺媽祖杆旁將手機面向金玉城商會上的時鐘)。 ", "帶入小時東南150°(24小時制)得出18點；接著帶入分鐘東北60°=3、北0°=1，得出分鐘為31分。"] },
            { id: 3, title: "第三關：醬油工廠", desc: "謎題：以醬油甕為棋，依照規則破除謎題並用鏡子照出答案。", answer: "黑豆", hints: ["將道具卡10方程式A、B、C、D、E、F、G答案解出，方程式中(道具卡11)，前面數字代表X，後面數字代表Y，[範例1+(-2)=-1，(X，Y)=(1，-2)]，所有XY座標皆無重複。 ", "次方座標範例A2+A=12，(X，Y)=(9，3)，在棋盤中(道具卡10)找到所有座標並塗黑。", "塗黑格子為答案對稱的一半，利用鏡子成像組成完整的字(可到醬油工廠中臥室的鏡子)，即可得出答案。"] },
            { id: 4, title: "第四關：西螺大橋", desc: "謎題：請於蝴蝶之眼 (半圓形長椅附近)中對準正中間的鐵杆在準心上轉動45度並重疊上過去與過去。", answer: "米", hints: ["先找到蝴蝶公園中眼睛的位置，使看過去的大橋正中間鐵杆呈現重疊。", "將十字旋轉45度，重疊0度與45度的十字。 ", "三金。"] },
            { id: 5, title: "第五關：蝴蝶公園", desc: "謎題：蝴蝶不只是一幅圖，翅膀中也藏著一條路徑與一個英文單字。\n\n全圖共有 9 個黑點，其中 7 個黑點對應實地裝置藝術，另外 2 個黑點是路线提示點。請從最右側星號起點出發，依照箭頭方向前進，推理消失黑點的位置，找出完整路線。\n\n走訪每一處裝置藝術時，請讀取旁邊的羅馬數字，並將它轉換成一般數字。\n\n解碼規則：A 到 Z 可視為一組等差數列，A 為首項，首項值為 1，公差為 1。請依照此數列，將數字轉換成對應字母。", answer: "VEGETABLE", hints: ["請從最右側的星號開始，不要隨意亂走，路線是逆時針方向前進。 ", "請依照箭頭方向，將「XX、XII、V」依序帶入缺少的裝置藝術位置，補完整條路線。", "每個裝置旁的羅馬數字要先轉成一般數字，再依照「A 是等差數列的首項，首項值為 1，公差為 1 pointer nudge」的規則，解出來就是A=1、B=2、C=3…..Z=26，再依據箭頭順序把對應的字母拼起來。"] },
            { id: 6, title: "第六關：福興宮", desc: "謎題：請參考-道具卡1\n\n♀=3之10→♂=「?」\n\n4之9後裔射太陽，兩個漁夫鬧不合，一個漁夫被砍頭\n\n參拜順序：1F、3F、1F、3F？", answer: "1717", hints: ["3之10代表第三根柱子、第十個字，4之9同理。", "後裔射太陽(日)，兩個漁夫鬧不合(留下一個「夫}字，一個漁「夫」被砍頭，得到「天」字。", "請在廟裡尋找參拜順序圖找出天公爐代表數字1、7，將天公爐代表數字帶入樓層得出四位數字即為答案。"] },
            { id: 7, title: "第七關：東市場", desc: "謎題：\n1：←↓→↓←\n\n2：利用道具卡12觀察並參考特色景點地圖，找出其中的共通點。\n\n3：1+8=E，4+E+L=?(道具卡13)\n\n4：☾+I", answer: "物盡其用", hints: ["依箭頭方向畫出筆畫最終可得出數字。", "具卡12為注音組成表格(上：聲母、中：介音、下：韻母、右：聲調)，將數字帶入特色景點地圖得出地點，把地點注音符號寫出分別看聲母、介音、韻母、聲調兩組地點的共通點。範例：右：聲調，地點4「長(三聲)老(三聲)教(四聲)會(四聲))」、地點24 「振(四聲)興(一聲)宮(一聲)」 共同聲調：四聲。", "4、E、L轉為電子表形式，並放在一起將重疊的部分刪掉得出數字「7」；月+ I =「用」；諧音5=「物'], 7=「其」"] },
            { 
                id: 8, 
                title: "小彩蛋：最後的關卡", 
                desc: "謎題：一半藏於線中，一半藏於格中；另一字藏於部首之間。\n\n將小彩蛋道具卡 2 對照小彩蛋道具卡 3 的雲林特產名稱連線，得上半部圖形。；將小彩蛋道具卡 1 依「醬油工廠」玩法帶入道具卡 10，得下半部圖形。上下相合，得第一字。\n\n破解位置線索，求出 X、Y、Z。對照小彩蛋道具卡 4，取出對應部首。三部首合一，得第二字。\n\n位置線索：\n3 : 2 = X : 2\n5 : 3 = Y+2 : 6\n4 : 7 = 12 : 2Z-1", 
                answer: "西螺", 
                hints: [] 
            }
        ];

        let currentLevel = null;
        const music = document.getElementById('bg-music');
        const musicIcon = document.getElementById('music-icon');
        
        // 【計時設定】主線前 7 關倒數計時
        const INITIAL_SECONDS = 180 * 60; 
        let remainingSeconds = INITIAL_SECONDS; 
        let timerInterval = null;
        let isTimeUp = false; 
        let isMainGameFinished = false; 
        
        // 【成績紀錄】主線
        let totalPenaltyMinutes = 0; 
        let wrongAnswersTracker = {}; 
        let completedLevels = [];
        let unlockedHints = {}; 
        let mainActualUsedSeconds = 0; 

        // 【每關單獨計時核心變數】
        let levelStartTime = null;        
        let levelUsedSeconds = {};        

        // 【新變數】第 8 關彩蛋獨立計時
        let hiddenLevelSeconds = 0; 
        let hiddenLevelInterval = null;
        let isHiddenLevelUnlocked = false;

        // 【新變數】玩家姓名
        let playerName = "";

        // 【網頁生命週期載入】自動檢測本地儲存區是否有舊紀錄
        window.addEventListener('DOMContentLoaded', () => {
            initGameDataStructure();
            loadFromLocalStorage();
        });

        function initGameDataStructure() {
            levelsData.forEach(l => { 
                if (wrongAnswersTracker[l.id] === undefined) wrongAnswersTracker[l.id] = 0; 
                if (levelUsedSeconds[l.id] === undefined) levelUsedSeconds[l.id] = 0; 
            });
        }

        // 加密並保存到本地
        function saveToLocalStorage() {
            const gameState = {
                playerName,
                remainingSeconds,
                isTimeUp,
                isMainGameFinished,
                totalPenaltyMinutes,
                wrongAnswersTracker,
                completedLevels,
                unlockedHints,
                mainActualUsedSeconds,
                levelUsedSeconds,
                hiddenLevelSeconds,
                isHiddenLevelUnlocked,
                isTimerRunning: timerInterval !== null,
                isHiddenTimerRunning: hiddenLevelInterval !== null
            };
            try {
                const rawString = JSON.stringify(gameState);
                const encryptedData = btoa(unescape(encodeURIComponent(rawString)));
                localStorage.setItem('xiluo_treasure_hunt_save_secure', encryptedData);
            } catch(e) {
                console.error("儲存失敗", e);
            }
        }

        // 讀取函數：不經詢問，直接在背景靜默還原
        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('xiluo_treasure_hunt_save_secure');
            if (!savedData) return;

            try {
                const decryptedStr = decodeURIComponent(escape(atob(savedData)));
                const state = JSON.parse(decryptedStr);
                
                // 如果是毫無進度的初始存檔，則不啟動自動恢復
                if (state.completedLevels.length === 0 && state.remainingSeconds === INITIAL_SECONDS && state.totalPenaltyMinutes === 0) {
                    return;
                }

                // 顯示底部的重置按鈕
                document.getElementById('reset-game-btn').style.display = 'inline-block';

                playerName = state.playerName || "冒險者";
                remainingSeconds = state.remainingSeconds;
                isTimeUp = state.isTimeUp;
                isMainGameFinished = state.isMainGameFinished;
                totalPenaltyMinutes = state.totalPenaltyMinutes;
                wrongAnswersTracker = state.wrongAnswersTracker;
                completedLevels = state.completedLevels;
                unlockedHints = state.unlockedHints;
                mainActualUsedSeconds = state.mainActualUsedSeconds;
                levelUsedSeconds = state.levelUsedSeconds;
                hiddenLevelSeconds = state.hiddenLevelSeconds;
                isHiddenLevelUnlocked = state.isHiddenLevelUnlocked;
                
                initGameDataStructure();
                
                // 顯示 HUD 並填入玩家名稱
                document.getElementById('display-player-name').innerText = playerName;
                document.getElementById('player-hud').style.display = 'flex';
                
                // 顯示計時面版
                document.getElementById('timer-container').style.display = 'flex';

                if (isHiddenLevelUnlocked) {
                    document.getElementById('floating-score-btn').style.display = 'block';
                }

                // 根據狀態繼續跑對應的計時器
                if (isMainGameFinished) {
                    if (completedLevels.includes(8)) {
                        const timerBox = document.getElementById('timer-box');
                        timerBox.className = "bg-slate-900/95 backdrop-blur border border-amber-400 px-5 py-2 rounded-xl shadow-2xl flex items-center space-x-3 shadow-glow-gold";
                        document.getElementById('timer-label').innerText = "✨ 彩蛋耗時";
                        document.getElementById('penalty-box').style.display = 'none';
                        updateHiddenTimerDisplay();
                    } else {
                        startHiddenTimer();
                    }
                } else {
                    if (isTimeUp) {
                        handleTimeUp();
                    } else {
                        startTimer();
                    }
                }

                // 渲染關卡並直接切換到選單
                renderLevelsGrid();
                switchView('levels-view');
                
            } catch (e) {
                console.error("儲存格式異常，已自動重置檔案。", e);
                clearSavedData(false);
            }
        }

        // 徹底清除儲存紀錄與計時狀態的函數（修正時間未重置問題）
        function clearSavedData() {
            // 第一步：安全密碼驗證
            const inputPassword = prompt("🔐 此動作將清除所有遊戲計時與破關成績。\n請輸入大會管理員密碼以確認執行：");
            
            // 如果玩家點取消
            if (inputPassword === null) return;

            // 驗證密碼是否正確
            if (inputPassword !== "0214") {
                alert("❌ 密碼錯誤！您沒有權限重設此遊戲紀錄。");
                return;
            }

            // 第二步：密碼正確後，進行最後二次確認
            const finalCheck = confirm("⚠️ 密碼正確！\n確定要徹底刪除所有尋寶關卡的紀錄、計時與成績嗎？\n此動作將無法復原！");
            if (!finalCheck) return;
            
            // 【核心修正】立刻停止畫面上所有正在跑的定時器，防止續秒與背景倒數
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (hiddenLevelInterval) {
                clearInterval(hiddenLevelInterval);
                hiddenLevelInterval = null;
            }

            // 【核心修正】將所有核心變數與計時重置回最初始狀態
            remainingSeconds = INITIAL_SECONDS;
            hiddenLevelSeconds = 0;
            totalPenaltyMinutes = 0;
            completedLevels = [];
            wrongAnswersTracker = {};
            unlockedHints = {};
            levelUsedSeconds = {};
            isTimeUp = false;
            isMainGameFinished = false;
            isHiddenLevelUnlocked = false;
            playerName = "";

            // 清除本地瀏覽器緩存
            localStorage.removeItem('xiluo_treasure_hunt_save_secure');
            
            alert("🧹 歷史紀錄與計時時間已成功完全清除！遊戲已重設為最初始狀態。");
            
            // 重新整理網頁，讓狀態徹底回歸
            window.location.reload();
        }

        function toggleMusic() {
            if (music.paused) {
                music.play().then(() => { musicIcon.innerText = "🎵"; }).catch(err => console.log("BGM 播放異常"));
            } else {
                music.pause();
                musicIcon.innerText = "🔇";
            }
        }

        function startAdventure() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            
            if (nameInput === "") {
                alert("⚠️ 請輸入您的名字或隊伍名稱，才能開啟尋寶之旅喔！");
                document.getElementById('player-name-input').focus();
                return;
            }
            
            playerName = nameInput;
            
            document.getElementById('display-player-name').innerText = playerName;
            document.getElementById('player-hud').style.display = 'flex';
            document.getElementById('reset-game-btn').style.display = 'inline-block';
            
            if (timerInterval || hiddenLevelInterval) {
                switchView('levels-view');
                return;
            }

            alert(`⏰ 西螺城市尋寶正式開始！\n\n【比賽規則提示】\n1. 總測驗時間：180 分鐘（穩定倒數）。\n2. 容錯機制：每關「前 3 次答錯」免罰，第 4 次（含）起每次累積加罰 3 分鐘。\n3. 提示機制：查看未解鎖提示累積加罰 10 分鐘，解鎖後可永久免費重複查看。\n4. 終極任務：完成前 7 大主線關卡後，正式比賽計時將會「立刻停止結算」！第 8 關隱藏彩蛋關卡時間將會獨立另外計算，不扣除也不影響主賽成績！\n\n祝你好運，祝 ${playerName} 順利通關！`);
            renderLevelsGrid();
            switchView('levels-view');
            document.getElementById('timer-container').style.display = 'flex';
            
            if (!timerInterval) {
                initGameDataStructure();
                startTimer();
                saveToLocalStorage();
            }
        }

        function startTimer() {
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (remainingSeconds <= 0) {
                    handleTimeUp();
                    return;
                }
                remainingSeconds--;
                updateTimerDisplay();
                saveToLocalStorage(); 
            }, 1000);
        }

        function startHiddenTimer() {
            if (timerInterval) clearInterval(timerInterval);

            const timerBox = document.getElementById('timer-box');
            timerBox.className = "bg-slate-900/95 backdrop-blur border border-amber-400 px-5 py-2 rounded-xl shadow-2xl flex items-center space-x-3 shadow-glow-gold";
            document.getElementById('timer-label').innerText = "✨ 彩蛋耗時";
            document.getElementById('penalty-box').style.display = 'none'; 

            updateHiddenTimerDisplay();
            hiddenLevelInterval = setInterval(() => {
                hiddenLevelSeconds++;
                updateHiddenTimerDisplay();
                saveToLocalStorage(); 
            }, 1000);
        }

        function updateHiddenTimerDisplay() {
            document.getElementById('game-timer').innerText = formatSecondsToHMS(hiddenLevelSeconds);
        }

        function handleTimeUp() {
            clearInterval(timerInterval);
            isTimeUp = true;
            remainingSeconds = 0;
            const timerBox = document.getElementById('timer-box');
            timerBox.className = "bg-red-950/95 backdrop-blur border border-red-500 px-5 py-2 rounded-xl shadow-2xl flex items-center space-x-3";
            document.getElementById('timer-label').innerText = "⏰ 狀態";
            document.getElementById('game-timer').innerText = "時間到！結束作答";
            document.getElementById('game-timer').className = "text-base font-bold text-red-200 tracking-wide";
            saveToLocalStorage();
            if (currentLevel) openQuiz(currentLevel.id);
        }

        function updateTimerDisplay() {
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            document.getElementById('game-timer').innerText = 
                String(hours).padStart(2, '0') + ":" + String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
            document.getElementById('penalty-minutes').innerText = `+${totalPenaltyMinutes}`;
        }

        function renderLevelsGrid() {
            const grid = document.getElementById('levels-grid');
            grid.innerHTML = '';
            
            const completedNormalCount = completedLevels.filter(id => id >= 1 && id <= 7).length;
            
            if (completedNormalCount === 7 && !isHiddenLevelUnlocked) {
                isHiddenLevelUnlocked = true;
                if (timerInterval) clearInterval(timerInterval);
                isMainGameFinished = true;
                mainActualUsedSeconds = INITIAL_SECONDS - remainingSeconds;
                
                document.getElementById('floating-score-btn').style.display = 'block';

                saveToLocalStorage();
                showMainGameCompleteModal();
                document.getElementById('levels-subtitle').innerHTML = "✨ <span class='text-amber-400 font-bold'>時空之門已開啟！終極挑戰就在眼前！</span> ✨";
            }

            levelsData.forEach(level => {
                if (level.id === 8 && !isHiddenLevelUnlocked) return;

                const isDone = completedLevels.includes(level.id);
                const titleText = isDone ? `${level.title} <span class="text-green-400 text-sm font-semibold ml-1">(已完成 ✓)</span>` : level.title;
                
                let borderClass = isDone ? 'border-green-600/60 hover:border-green-500' : 'border-slate-700/50 hover:border-amber-500/50';
                let badgeClass = isDone ? 'bg-green-500/10 text-green-400 border-green-500/30' : 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                let hiddenCardGlow = "";

                if (level.id === 8 && !isDone) {
                    borderClass = "border-amber-500";
                    badgeClass = "bg-amber-500 text-slate-950 font-extrabold border-amber-300";
                    hiddenCardGlow = "shadow-glow-gold";
                }

                const card = document.createElement('div');
                card.className = `bg-slate-900/80 backdrop-blur rounded-xl shadow-lg p-6 border ${borderClass} ${hiddenCardGlow} cursor-pointer transition duration-300 transform hover:-translate-y-1 flex flex-col justify-between`;
                card.setAttribute('onclick', `openQuiz(${level.id})`);
                card.innerHTML = `
                    <div>
                        <div class="w-10 h-10 rounded-full ${badgeClass} flex items-center justify-center font-bold mb-4 border text-sm">
                            ${level.id === 8 ? '★' : level.id}
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">${titleText}</h3>
                        <p class="text-sm text-slate-400">${isDone ? `已花費時間：${formatSecondsToHMS(levelUsedSeconds[level.id])}` : (level.id === 8 ? '🔥 終極魔王關卡，點擊迎戰！' : '點擊進入挑戰...')}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function switchView(viewId) {
            if (viewId === 'levels-view' && currentLevel && !completedLevels.includes(currentLevel.id)) {
                accumulateCurrentLevelTime();
            }

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('levels-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'none';
            const target = document.getElementById(viewId);
            if (viewId === 'home-view') {
                target.style.display = 'flex';
                document.getElementById('player-hud').style.display = 'none';
            } else {
                if (viewId === 'levels-view') renderLevelsGrid();
                target.style.display = 'block';
                if (playerName) document.getElementById('player-hud').style.display = 'flex';
            }
            saveToLocalStorage();
        }

        function accumulateCurrentLevelTime() {
            if (!currentLevel) return;
            if (currentLevel.id === 8) {
                levelUsedSeconds[8] = hiddenLevelSeconds;
            } else {
                if (levelStartTime !== null) {
                    const elapsed = levelStartTime - remainingSeconds;
                    if (elapsed > 0) {
                        levelUsedSeconds[currentLevel.id] += elapsed;
                    }
                }
            }
            levelStartTime = null; 
        }

        function updateHintButtonsStyle() {
            if (currentLevel.id === 8) return;

            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`hint-btn-${i}`);
                const hintKey = `${currentLevel.id}_${i}`;
                if (unlockedHints[hintKey]) {
                    btn.className = "w-full bg-green-700 hover:bg-green-600 text-white font-bold py-2 px-1 rounded-xl text-xs transition cursor-pointer border border-green-500 text-center shadow-inner";
                    btn.innerHTML = `🔓 提示${i === 1 ? '一' : i === 2 ? '二' : '三'} (已開)`;
                } else {
                    btn.className = "w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 font-medium py-2 px-1 rounded-xl text-xs transition cursor-pointer text-center";
                    btn.innerHTML = `💡 提示${i === 1 ? '一' : i === 2 ? '二' : '三'}`;
                }
            }
        }

        function openQuiz(levelId) {
            currentLevel = levelsData.find(l => l.id === levelId);
            if (!currentLevel) return;

            if (!completedLevels.includes(currentLevel.id)) {
                levelStartTime = remainingSeconds;
            }

            if (currentLevel.id === 8 && !hiddenLevelInterval && !completedLevels.includes(8)) {
                startHiddenTimer();
            }

            const isDone = completedLevels.includes(currentLevel.id);
            document.getElementById('quiz-id').innerText = currentLevel.id === 8 ? "SECRET LEVEL" : `Level 0${currentLevel.id}`;
            document.getElementById('quiz-title').innerText = isDone ? `${currentLevel.title} (已完成)` : currentLevel.title;
            document.getElementById('quiz-description').innerText = currentLevel.desc;
            
            const hintSectionTitle = document.getElementById('hint-section-title');
            const hintNotice = document.getElementById('hint-penalty-notice');
            const hintButtonsContainer = document.getElementById('hint-buttons-container');

            if (currentLevel.id === 8) {
                hintSectionTitle.innerText = "⏱️ 本關卡提示狀態：";
                hintNotice.innerText = "💡 本關卡為終極隱藏彩蛋，不提供任何線索提示，請憑實力找出最終真相！";
                hintNotice.className = "text-xs text-amber-400 font-semibold bg-amber-950/20 p-3 rounded-xl border border-amber-500/20";
                hintButtonsContainer.style.display = 'none'; 
            } else {
                hintSectionTitle.innerText = "遇到了瓶頸嗎？索取線索提示：";
                hintNotice.innerText = "⚠️ 注意：未解鎖的提示一經查看會累積加罰 10 分鐘至主成績，解鎖後可永久免費重複查看。";
                hintNotice.className = "text-xs text-red-400 mb-3";
                hintButtonsContainer.style.display = 'grid';
                updateHintButtonsStyle();
            }

            const wrongCountLabel = document.getElementById('quiz-wrong-count');
            if (isDone || (isTimeUp && currentLevel.id !== 8)) {
                wrongCountLabel.style.display = 'none';
            } else {
                wrongCountLabel.style.display = 'block';
                wrongCountLabel.innerText = `❌ 本關已錯：${wrongAnswersTracker[currentLevel.id]} 次`;
            }

            const inputField = document.getElementById('answer-input');
            const submitBtn = document.getElementById('submit-btn');
            const feedback = document.getElementById('feedback-message');

            if (isTimeUp && currentLevel.id !== 8) { 
                inputField.value = ''; inputField.disabled = true;
                inputField.className = "w-full px-4 py-3 bg-red-950/20 border border-red-900 rounded-xl text-red-400 cursor-not-allowed outline-none";
                submitBtn.disabled = true; submitBtn.innerText = "挑戰時間已結束";
                submitBtn.className = "w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl shadow-md cursor-not-allowed";
                feedback.style.display = 'block';
                feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border bg-red-950/40 text-red-400 border-red-900/50";
                feedback.innerText = "⏰ 180 分鐘倒數已歸零，無法再提交答案。";
            } else if (isDone) {
                inputField.value = currentLevel.answer; inputField.disabled = true;
                inputField.className = "w-full px-4 py-3 bg-slate-950 border border-green-800 rounded-xl text-green-400 cursor-not-allowed outline-none font-semibold";
                submitBtn.disabled = true; submitBtn.innerText = "此關已成功破解";
                submitBtn.className = "w-full bg-slate-800 text-slate-500 font-bold py-3 rounded-xl shadow-md cursor-not-allowed";
                feedback.style.display = 'block';
                feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border bg-green-950/40 text-green-400 border-green-800/50";
                feedback.innerText = "✨ 此關卡已回答正確！玩家可自由檢閱內容。";
            } else {
                inputField.value = ''; inputField.disabled = false;
                inputField.className = "w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition";
                submitBtn.disabled = false; submitBtn.innerText = "提交答案";
                submitBtn.className = "w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow-md transition cursor-pointer";
                feedback.style.display = 'none';
            }
            switchView('quiz-view');
        }

        function askForHint(hintNumber) {
            if (isTimeUp && currentLevel.id !== 8) { alert("時間已到，無法獲取提示。"); return; }
            if (completedLevels.includes(currentLevel.id)) { alert("此關卡已破關，提示功能已鎖定。"); return; }
            if (currentLevel.id === 8) return; 

            const hintKey = `${currentLevel.id}_${hintNumber}`;
            const modal = document.getElementById('hint-modal');
            const contentDiv = document.getElementById('modal-hint-content');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const warningText = document.getElementById('modal-hint-warning');
            const iconDiv = document.getElementById('modal-hint-icon');

            if (unlockedHints[hintKey]) {
                iconDiv.className = "w-12 h-12 rounded-full bg-green-500/10 text-green-400 flex items-center justify-center font-bold mb-4 mx-auto border border-green-500/30 text-xl";
                iconDiv.innerText = "🔓";
                document.getElementById('modal-hint-title').innerText = `💡 提示 ${hintNumber} 內容 (已解鎖)`;
                warningText.innerHTML = "✨ 本提示先前已解鎖，本次查看<span class='text-green-400 font-bold'>完全免費</span>。";
                contentDiv.innerText = currentLevel.hints[hintNumber - 1];
                contentDiv.style.display = 'block';
                document.getElementById('modal-cancel-btn').style.display = 'none';
                confirmBtn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-xl text-sm transition cursor-pointer";
                confirmBtn.innerText = "關閉檢閱";
                confirmBtn.onclick = function() { closeHint(); };
                modal.style.display = 'flex';
                return;
            }

            alert(`💡 您正準備查看【提示 ${hintNumber}】\n\n⚠️ 警告：首次開啟本線索將使最終成績「加罰 10 分鐘」！`);

            iconDiv.className = "w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center font-bold mb-4 mx-auto border border-amber-500/30 text-xl";
            iconDiv.innerText = "⏱️";
            document.getElementById('modal-hint-title').innerText = `確認查看 提示 ${hintNumber} 嗎？`;
            warningText.innerHTML = "點擊「確定查看」後，成績將會<span class='text-red-400 font-bold'>累積加罰 10 分鐘</span>！解鎖後可永久免費查看。";
            contentDiv.style.display = 'none';
            document.getElementById('modal-cancel-btn').style.display = 'block';
            confirmBtn.className = "bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-2 px-4 rounded-xl text-sm transition cursor-pointer w-1/2";
            confirmBtn.innerText = "確定查看 (+10分鐘)";
            
            confirmBtn.onclick = function() {
                totalPenaltyMinutes += 10;
                unlockedHints[hintKey] = true; 
                updateTimerDisplay(); 
                updateHintButtonsStyle();
                saveToLocalStorage();

                iconDiv.innerText = "🔓";
                document.getElementById('modal-hint-title').innerText = `💡 提示 ${hintNumber} 內容`;
                warningText.innerHTML = "🎉 提示解鎖成功！此按鈕已永久開啟，重複閱讀免收任何加罰費用。";
                contentDiv.innerText = currentLevel.hints[hintNumber - 1];
                contentDiv.style.display = 'block';
                document.getElementById('modal-cancel-btn').style.display = 'none';
                confirmBtn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-xl text-sm transition cursor-pointer";
                confirmBtn.innerText = "收下提示";
                confirmBtn.onclick = function() { closeHint(); };
            };
            modal.style.display = 'flex';
        }

        function closeHint() {
            document.getElementById('hint-modal').style.display = 'none';
            saveToLocalStorage();
        }

        function formatSecondsToHMS(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            return String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
        }

        function generateLevelTimeDetailsHTML() {
            let html = `<div class="mt-4 border-t border-slate-800 pt-3">
                            <div class="text-xs text-amber-400 font-bold mb-2 flex items-center">
                                📊 各關卡純解謎耗時細目：
                            </div>
                            <div class="grid grid-cols-1 gap-1.5 text-xs">`;
            for (let i = 1; i <= 7; i++) {
                const isDone = completedLevels.includes(i);
                const timeString = isDone ? formatSecondsToHMS(levelUsedSeconds[i]) : "尚未完成";
                const colorClass = isDone ? "text-slate-300" : "text-slate-500 italic";
                const badge = isDone ? `<span class="text-green-400 font-semibold">✓ 已過關</span>` : `<span class="text-slate-600">⏳ 未解開</span>`;

                html += `
                    <div class="flex justify-between bg-slate-900/40 px-3 py-1.5 rounded border border-slate-800/60">
                        <span class="${colorClass}">Level 0${i} (${levelsData[i-1].title.split('：')[1]})</span>
                        <div class="space-x-2 font-mono">
                            ${badge}
                            <span class="${isDone ? 'text-white font-bold' : 'text-slate-600'}">${timeString}</span>
                        </div>
                    </div>`;
            }
            html += `</div></div>`;
            return html;
        }

        function openScoreBoard() {
            if (currentLevel && !completedLevels.includes(currentLevel.id)) {
                accumulateCurrentLevelTime();
            }

            if (completedLevels.includes(8)) {
                buildHiddenGameCompleteMarkup();
            } else {
                buildMainGameCompleteMarkup();
            }
            document.getElementById('finish-modal').style.display = 'flex';
            saveToLocalStorage();
        }

        function buildMainGameCompleteMarkup() {
            const mainTotalSeconds = mainActualUsedSeconds + (totalPenaltyMinutes * 60);
            document.getElementById('finish-modal-icon').innerText = "🏆";
            document.getElementById('finish-modal-title').innerText = "🏆 主線挑戰成功破關！";
            document.getElementById('finish-modal-subtitle').innerText = "前 7 關主線任務已全部擊破，正式賽計時已安全停止！";
            
            const resultsBox = document.getElementById('finish-results-box');
            resultsBox.innerHTML = `
                <div class="mb-2 text-sm text-amber-400 font-bold">👤 挑戰隊伍/玩家：${playerName}</div>
                <div class="flex justify-between items-center text-slate-300">
                    <span>1. 實際主線消耗時間：</span>
                    <span class="text-white font-bold">${formatSecondsToHMS(mainActualUsedSeconds)}</span>
                </div>
                <div class="flex justify-between items-center text-red-400">
                    <span>2. 累計加罰懲罰時間：</span>
                    <span class="font-bold">+ ${totalPenaltyMinutes} 分鐘</span>
                </div>
                <div class="border-t border-slate-800 pt-2 flex justify-between items-center text-lg font-bold text-green-400">
                    <span>★ 最終正式比賽成績：</span>
                    <span>${formatSecondsToHMS(mainTotalSeconds)}</span>
                </div>
                ${generateLevelTimeDetailsHTML()}
            `;
            const closeBtn = document.getElementById('finish-modal-close-btn');
            closeBtn.innerText = "關閉並返回遊戲 ➔";
            closeBtn.className = "w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition cursor-pointer";
        }

        function showMainGameCompleteModal() {
            buildMainGameCompleteMarkup();
            document.getElementById('finish-modal-close-btn').innerText = "前往挑戰彩蛋隱藏關 ➔";
            document.getElementById('finish-modal').style.display = 'flex';
        }

        function buildHiddenGameCompleteMarkup() {
            const mainTotalSeconds = mainActualUsedSeconds + (totalPenaltyMinutes * 60);
            document.getElementById('finish-modal-icon').innerText = "👑";
            document.getElementById('finish-modal-title').innerText = "👑 完美全通關達成！";
            document.getElementById('finish-modal-subtitle').innerText = "你們不僅完成了主線，甚至連神祕的隱藏彩蛋也順利解開了！";
            
            const resultsBox = document.getElementById('finish-results-box');
            resultsBox.innerHTML = `
                <div class="mb-2 text-sm text-amber-400 font-bold">👤 終極挑戰者：${playerName}</div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1 mb-2">
                    <div class="text-xs text-amber-400 font-semibold mb-1">🏁 正式比賽主線排名成績</div>
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>純解謎耗時：${formatSecondsToHMS(mainActualUsedSeconds)}</span>
                        <span>加罰時間：+${totalPenaltyMinutes}分</span>
                    </div>
                    <div class="flex justify-between text-sm font-bold text-green-400 border-t border-slate-800/60 pt-1 mt-1">
                        <span>大會排序最終成績：</span>
                        <span>${formatSecondsToHMS(mainTotalSeconds)}</span>
                    </div>
                </div>
                <div class="bg-amber-950/20 p-3 rounded-xl border border-amber-500/20 flex justify-between items-center mb-2">
                    <div>
                        <div class="text-xs text-amber-300 font-semibold">✨ 彩蛋關挑戰耗時</div>
                        <div class="text-xs text-slate-400">（此關卡無任何提示協助）</div>
                    </div>
                    <span class="text-amber-400 text-lg font-bold font-mono">${formatSecondsToHMS(hiddenLevelSeconds)}</span>
                </div>
                ${generateLevelTimeDetailsHTML()}
            `;
            
            const closeBtn = document.getElementById('finish-modal-close-btn');
            closeBtn.innerText = "關閉視窗（可隨時回頭翻閱內容）";
            closeBtn.className = "w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition cursor-pointer";
        }

        function handleHiddenGameComplete() {
            if (hiddenLevelInterval) clearInterval(hiddenLevelInterval); 
            levelUsedSeconds[8] = hiddenLevelSeconds; 
            buildHiddenGameCompleteMarkup();
            document.getElementById('finish-modal').style.display = 'flex';
            saveToLocalStorage();
        }

        function closeFinishModal() {
            document.getElementById('finish-modal').style.display = 'none';
            if (document.getElementById('quiz-view').style.display === 'block') {
                switchView('levels-view');
            }
            saveToLocalStorage();
        }

        function checkAnswer() {
            if (isTimeUp && currentLevel.id !== 8) return;
            if (completedLevels.includes(currentLevel.id)) return;

            let userAnswer = document.getElementById('answer-input').value.trim().toLowerCase();
            let correctAnswer = currentLevel.answer.trim().toLowerCase();
            
            userAnswer = userAnswer.replace(/[-─]/g, '－').replace(/：/g, ':');
            correctAnswer = correctAnswer.replace(/[-─]/g, '－').replace(/：/g, ':');

            const feedback = document.getElementById('feedback-message');
            feedback.style.display = 'block';
            feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border";

            if (userAnswer === correctAnswer) {
                feedback.innerText = "🎉 太厲害了！答案完全正確！";
                feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border bg-green-900/50 text-green-300 border-green-700";
                alert("🎉 回答正確！成功破解本關謎題！");

                if (!completedLevels.includes(currentLevel.id)) completedLevels.push(currentLevel.id);

                accumulateCurrentLevelTime();
                saveToLocalStorage();

                if (currentLevel.id === 8) {
                    setTimeout(() => { handleHiddenGameComplete(); }, 1200);
                } else {
                    setTimeout(() => { switchView('levels-view'); }, 1500);
                }

            } else if (userAnswer === "") {
                feedback.innerText = "⚠️ 請輸入答案後再提交喔！";
                feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border bg-amber-900/50 text-amber-300 border-amber-700";
                alert("⚠️ 請輸入答案後再點擊提交！");
            } else {
                wrongAnswersTracker[currentLevel.id] += 1;
                const currentWrongCount = wrongAnswersTracker[currentLevel.id];
                document.getElementById('quiz-wrong-count').innerText = `❌ 本關已錯：${currentWrongCount} 次`;

                if (currentLevel.id === 8) {
                    feedback.innerText = `❌ 答案不太對喔！這題需要一點邏輯與數學拆解，再試一次（隱藏關不扣主線分數）。`;
                    feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border bg-red-900/50 text-red-300 border-red-700";
                    alert(`❌ 答案不對喔！\n\n💡 別氣餒，此為彩蛋關，不設任何提示。答錯「不會」加罰您的正式比賽成績，換個角度想想！`);
                    saveToLocalStorage();
                    return;
                }

                if (currentWrongCount > 3) {
                    totalPenaltyMinutes += 3;
                    updateTimerDisplay(); 
                    feedback.innerText = `❌ 答案不正確！本關已累積錯誤 ${currentWrongCount} 次，已達加罰門檻，右上角成績已加罰 3 分鐘！`;
                    feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border bg-red-950/80 text-red-300 border-red-600";
                    alert(`🚨 答案錯誤！\n\n❌ 本關卡目前已累計答錯【 ${currentWrongCount} 】次！\n⚠️ 由於答錯次數已「大於 3 次」的免罰空間，本次答錯已將累積加罰時間「額外追加 3 分鐘」！`);
                } else {
                    const safeLeft = 3 - currentWrongCount;
                    feedback.innerText = `❌ 答案似乎不太對，再仔細觀察看看提示吧！（第 4 次答錯起將會累積加罰時間喔！）`;
                    feedback.className = "mt-6 text-center font-semibold p-3 rounded-xl mb-6 border bg-red-900/50 text-red-300 border-red-700";
                    alert(`❌ 答案不對喔！\n\n📌 本關卡目前已累計答錯【 ${currentWrongCount} 】次。\n💡 提示：前 3 次為安全容錯範圍，目前「不會加罰時間」（剩餘 ${safeLeft} 次免罰機會）。重新思考看看吧！`);
                }
                saveToLocalStorage();
            }
        }
    </script>
</body>
</html>
